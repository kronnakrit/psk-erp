      tags:
      - Profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: profile returned
    patch:
      summary: Update own profile
      tags:
      - Profile
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: profile updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
    pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
security:
- bearerAuth: []
servers:
- url: "{scheme}://{defaultHost}"
  variables:
    scheme:
      default: http
    defaultHost:
      default: localhost:3000
