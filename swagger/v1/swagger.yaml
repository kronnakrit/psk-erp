      - bearerAuth: []
      responses:
        '200':
          description: countries returned
  "/api/v1/countries/{id}":
    parameters:
    - name: id
      in: path
      description: ISO 3166-1 alpha-2 code (e.g. TH)
      required: true
      schema:
        type: string
    get:
      summary: Show country
      tags:
      - Countries
      security:
      - bearerAuth: []
      responses:
        '200':
          description: country returned
  "/api/v1/users":
    get:
      summary: List users
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: user list returned
    post:
      summary: Create user
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: invalid params
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    username:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - username
                  - password
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Update user
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: user updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
    delete:
      summary: Delete user
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '204':
          description: user deleted
  "/api/v1/users/{id}/activate":
    parameters:
    - name: id
      in: path
