test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# DigitalOcean Spaces (S3-compatible)
# Set DO_SPACES_KEY, DO_SPACES_SECRET via .kamal/secrets
# Set DO_SPACES_REGION and DO_SPACES_BUCKET via config/deploy.yml env.clear
amazon:
  service: S3
  access_key_id: <%= ENV.fetch("DO_SPACES_KEY", nil) %>
  secret_access_key: <%= ENV.fetch("DO_SPACES_SECRET", nil) %>
  region: <%= ENV.fetch("DO_SPACES_REGION", "sgp1") %>
  bucket: <%= ENV.fetch("DO_SPACES_BUCKET", nil) %>
  endpoint: https://<%= ENV.fetch("DO_SPACES_REGION", "sgp1") %>.digitaloceanspaces.com
  force_path_style: false

# Remember not to checkin your GCS keyfile to a repository
